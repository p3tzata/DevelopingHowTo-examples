plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.10'
  id 'io.spring.dependency-management' version '1.1.7'
//  id 'org.hibernate.orm' version '6.6.41.Final'
  id 'org.graalvm.buildtools.native' version '0.10.6'
}

group = 'org.example'
version = '0.0.1-SNAPSHOT'
description = 'spring-native-gradle-simple'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  runtimeOnly 'org.hsqldb:hsqldb'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

//hibernate {
//  enhancement {
//    enableAssociationManagement = true
//  }
//}

tasks.named('test') {
  useJUnitPlatform()
}

graalvmNative {
  testSupport = false
  binaries {
    main {
      buildArgs.add("--strict-image-heap")
      buildArgs.add('--enable-monitoring=heapdump,jfr')
      buildArgs.add('-o myNativeApp')
      buildArgs.add('-H:+UnlockExperimentalVMOptions')
      buildArgs.add('-H:ServiceLoaderFeatureExcludeServices=org.hibernate.bytecode.spi.BytecodeProvider')
    }
  }

  agent {
    metadataCopy {
      outputDirectories.add("src/main/resources/META-INF/native-image/")
      mergeWithExisting = true
    }
  }

}
