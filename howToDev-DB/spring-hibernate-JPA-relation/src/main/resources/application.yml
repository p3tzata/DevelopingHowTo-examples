spring:
 application:
  name: spring-hibernate-JPA-relation
---
server:
  port: 8014
---
spring:
  datasource:
    url: jdbc:h2:mem:testdb;
    driver-class-name: org.h2.Driver
    #username: root
    #password: 123456
  jpa:
    database: h2
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    #defer-datasource-initialization: true #because we use seeding via ..src/main/resources/data.sql
  h2:
    console:
      enabled: true
---
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        type: trace
---
spring:
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 30
        order_inserts: true
---